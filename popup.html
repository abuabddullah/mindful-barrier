<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindfulBarrier</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-title">
        <span class="icon">🛑</span>
        <h1>MindfulBarrier</h1>
      </div>
      <div class="status-indicator-badge">
        <span class="dot"></span>
        <span>সুরক্ষা চালু</span>
      </div>
    </header>

    <!-- Stats Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-val" id="statBlocked">০</span>
        <span class="stat-lbl">বাধা দেওয়া হয়েছে</span>
      </div>
      <div class="stat-card highlight">
        <span class="stat-val" id="statSaved">০</span>
        <span class="stat-lbl">প্রলোভন জয় করেছেন</span>
      </div>
    </section>

    <!-- Periodic Istighfar Reminder Section -->
    <section class="istighfar-section">
      <div class="istighfar-header">
        <div class="istighfar-title">
          <span class="icon">📿</span>
          <span>ইস্তিগফার ও জিকির রিমাইন্ডার</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleIstighfar">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="istighfar-body" id="istighfarBody">
        <div class="istighfar-row">
          <label for="istighfarInterval">বিরতির সময়:</label>
          <select id="istighfarInterval" class="istighfar-select">
            <option value="1">প্রতি ১ মিনিট পর পর</option>
            <option value="2">প্রতি ২ মিনিট পর পর</option>
            <option value="5">প্রতি ৫ মিনিট পর পর</option>
            <option value="10">প্রতি ১০ মিনিট পর পর</option>
            <option value="15">প্রতি ১৫ মিনিট পর পর</option>
            <option value="30">প্রতি ৩০ মিনিট পর পর</option>
          </select>
        </div>

        <div class="istighfar-status-card">
          <div class="status-indicator">
            <span class="pulse-dot" id="istighfarPulse"></span>
            <span class="status-text" id="istighfarCountdownText">স্ট্যাটাস: বন্ধ রয়েছে</span>
          </div>
          <button id="btnTestIstighfar" class="btn-test-audio" title="টেস্ট প্লে করে চেক করুন">▶️ টেস্ট শুনুন</button>
        </div>

        <div class="istighfar-options">
          <label class="checkbox-option">
            <input type="checkbox" id="chkAutoResume" checked>
            <span>ভিডিও/অডিও সাময়িক পজ করে জিকির শেষে আবার চালু হবে</span>
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="chkProtectCalls" checked>
            <span>গুগল মিট / কলের অডিও নিরাপদ রাখা (মিটিংয়ে বিঘ্ন ঘটবে না)</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Mindful Workout / Interval Trainer Section -->
    <section class="workout-trigger-section">
      <div class="workout-trigger-header">
        <div class="workout-title">
          <span class="icon">⚡</span>
          <span>ইন্টারভাল ওয়ার্কআউট এরিনা</span>
        </div>
        <span class="workout-pill">HIIT + Nasheed</span>
      </div>

      <div class="workout-quick-row">
        <div class="quick-col">
          <label>মোট সময়:</label>
          <select id="quickTotalTime" class="workout-select">
            <option value="15">১৫ মি.</option>
            <option value="20">২০ মি.</option>
            <option value="30" selected>৩০ মি.</option>
            <option value="45">৪৫ মি.</option>
            <option value="60">৬০ মি.</option>
          </select>
        </div>
        <div class="quick-col">
          <label>ওয়ার্ক:</label>
          <select id="quickWorkTime" class="workout-select">
            <option value="20">২০ সে.</option>
            <option value="30" selected>৩০ সে.</option>
            <option value="45">৪৫ সে.</option>
            <option value="60">৬০ সে.</option>
          </select>
        </div>
        <div class="quick-col">
          <label>রেস্ট:</label>
          <select id="quickRestTime" class="workout-select">
            <option value="15">১৫ সে.</option>
            <option value="30" selected>৩০ সে.</option>
            <option value="45">৪৫ সে.</option>
            <option value="60">৬০ সে.</option>
          </select>
        </div>
      </div>

      <button id="btnOpenWorkout" class="btn-launch-workout">
        <span>🔥 ওয়ার্কআউট এরিনা খুলুন (নাসিদ লুপ)</span>
        <span class="arrow-icon">↗</span>
      </button>
    </section>

    <!-- Quick Check Presets (Social Media) -->
    <section class="presets-section">
      <div class="section-title">
        <span>জনপ্রিয় সোশ্যাল মিডিয়া নির্বাচন করুন</span>
        <button id="btnSelectAll" class="btn-text-small">সব সিলেক্ট</button>
      </div>

      <div class="preset-grid" id="presetGrid">
        <!-- Preset checkboxes rendered dynamically -->
      </div>
    </section>

    <!-- Custom URLs / Domains -->
    <section class="custom-section">
      <div class="section-title">
        <span>যেকোনো ওয়েবসাইট বা URL ব্লক করুন</span>
      </div>
      <div class="add-url-row">
        <input type="text" id="customUrlInput" placeholder="যেমন: netflix.com বা যেকোনো লিঙ্ক">
        <button id="btnAddCustomUrl" class="btn-primary-add">+ যুক্ত করুন</button>
      </div>

      <!-- Custom URLs List -->
      <div class="custom-list" id="customList">
        <!-- Dynamic custom list -->
      </div>
    </section>

    <!-- Footer Action -->
    <footer class="popup-footer">
      <button id="btnTriggerDeactivate" class="btn-deactivate">
        ⚠️ সম্পূর্ণ সুরক্ষা নিষ্ক্রিয় করবেন? (১০টি ধাপ লাগবে)
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
